<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ORBIT — проверка босса и оружия</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import Game from '/src/game/game.tsx'
      import { bossAltitude, createRun } from '/src/game/engine.ts'
      import '/src/index.css'

      // Visual smoke fixture served by Vite only; not an entry point of the production build.
      const run = createRun(900, 650, 'paused')
      run.time = 44
      run.bossCycle = 1
      run.weaponLevel = 2
      run.shieldLevel = 1
      run.shield = 30
      run.hp = 82
      run.money = 60
      run.entities = [
        { id: 1, kind: 'weapon', x: 600, y: 400, speed: 0 },
        { id: 2, kind: 'boss', x: 450, y: bossAltitude, speed: 0, hp: 42, maxHp: 42, age: 4, cooldown: 3 },
      ]
      run.nextId = 3
      if (new URLSearchParams(location.search).has('defeat')) {
        run.hp = 1
        run.shield = 0
        run.entities.push({ id: run.nextId++, kind: 'hostile', x: run.x, y: run.y, speed: 0 })
      }
      createRoot(document.getElementById('root')).render(React.createElement(Game, { initialRun: run }))
    </script>
  </body>
</html>
